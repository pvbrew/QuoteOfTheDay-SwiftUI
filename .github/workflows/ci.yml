name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt in sorted(d, reverse=True):
              if 'iOS' in rt:
                  for dev in d[rt]:
                      if 'iPhone' in dev['name']:
                          print(dev['udid']); sys.exit(0)
          sys.exit(1)")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project QuoteOfTheDay-SwiftUI.xcodeproj \
            -scheme QuoteOfTheDay-SwiftUI \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO
