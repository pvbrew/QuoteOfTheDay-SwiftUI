name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime, devices in sorted(data.items(), reverse=True):
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d['name'].startswith('iPhone') and d['isAvailable']:
                      print(d['udid']); sys.exit(0)
          sys.exit('No iPhone simulator found')
          ")
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project QuoteOfTheDay-SwiftUI.xcodeproj \
            -scheme QuoteOfTheDay-SwiftUI \
            -destination "id=$SIMULATOR_UDID" \
            -only-testing:QuoteOfTheDay-SwiftUITests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
